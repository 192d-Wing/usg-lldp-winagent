[workspace]
resolver = "3"
members = ["crates/lldp-codec", "crates/lldp-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/192d-wing/usg-lldp-winagent"
authors = ["John Edward Willman V"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
doc_markdown = "allow"
similar_names = "allow"
many_single_char_names = "allow"
must_use_candidate = "allow"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
lldp-codec = { path = "crates/lldp-codec" }
tokio = { version = "1.47", default-features = false }
