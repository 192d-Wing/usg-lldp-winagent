[workspace]
resolver = "3"
members = ["crates/lldp-codec", "crates/lldp-core", "crates/lldp-config", "crates/lldp-windows", "crates/lldp-ipc", "apps/winlldp-service", "apps/winlldp-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/192d-wing/usg-lldp-winagent"
authors = ["John Edward Willman V"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
doc_markdown = "allow"
similar_names = "allow"
many_single_char_names = "allow"
must_use_candidate = "allow"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
lldp-codec = { path = "crates/lldp-codec", version = "0.1.0" }
tokio = { version = "1.47", default-features = false }
lldp-core = { path = "crates/lldp-core", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
lldp-config = { path = "crates/lldp-config", version = "0.1.0" }
windows = "0.62"
lldp-ipc = { path = "crates/lldp-ipc", version = "0.1.0" }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
windows-service = "0.8"
lldp-windows = { path = "crates/lldp-windows", version = "0.1.0" }
