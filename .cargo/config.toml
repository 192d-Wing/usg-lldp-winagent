# Exploit mitigations for the Windows binaries. Rust's MSVC targets already
# enable DEP, ASLR with high-entropy addresses, and SafeSEH-equivalent
# protections; Control Flow Guard is opt-in. The RUSTFLAGS environment
# variable replaces these flags rather than adding to them, so CI jobs that
# set RUSTFLAGS build without CFG; release.yml does not set it.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "control-flow-guard"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "control-flow-guard"]
