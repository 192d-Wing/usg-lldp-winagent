[package]
name = "lldp-codec-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lldp-codec = { path = "../crates/lldp-codec" }

[[bin]]
name = "lldpdu_decode"
path = "fuzz_targets/lldpdu_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tlv_parse"
path = "fuzz_targets/tlv_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "org_tlv_parse"
path = "fuzz_targets/org_tlv_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame_parse"
path = "fuzz_targets/frame_parse.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1

[workspace]
