name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  portable:
    name: Portable crates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
      - name: Cross-check Windows targets
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
          cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc
          cargo check --workspace --target aarch64-pc-windows-msvc

  powershell:
    name: PowerShell module (Pester, ScriptAnalyzer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path powershell/WinLldp -Recurse -Severity Warning,Error
          $r | Format-Table -AutoSize
          if ($r | Where-Object Severity -eq 'Error') { exit 1 }
      - name: Test
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser
          Invoke-Pester -Path powershell/WinLldp/tests -CI

  msi:
    name: MSI build (unsigned, x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p winlldp-service -p winlldp-cli
      - name: Install WiX v7
        run: |
          dotnet tool install --global wix --version 7.0.0
          wix eula accept wix7
          wix extension add -g WixToolset.Util.wixext/7.0.0
      - name: Build MSI
        run: dotnet build packaging/wix/WinLLDP.wixproj -c Release -p:Platform=x64 -p:BinDir=${{ github.workspace }}\target\release -p:ProductVersion=0.0.0 -p:OutputPath=${{ github.workspace }}\dist\
      - name: Smoke test binaries
        shell: pwsh
        run: |
          .\target\release\winlldp.exe --version
          .\target\release\winlldp.exe config validate examples\config.yaml
          .\target\release\winlldp-service.exe validate --config examples\config.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: WinLLDP-ci-x64-unsigned
          path: dist/*.msi

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  fuzz:
    name: Fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [lldpdu_decode, tlv_parse, org_tlv_parse, frame_parse, config_parse]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} seeds/${{ matrix.target }} -- -max_total_time=120 -max_len=2048
        working-directory: fuzz
